name: datasourceintelligence

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datasource
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ds_network

  redis:
    image: redis:7-alpine
    container_name: ds_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ds_network

  ollama:
    image: ollama/ollama:0.31.2
    container_name: ds_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 2
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ds_network

  ollama-init:
    image: ollama/ollama:0.31.2
    container_name: ds_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[ollama-init] Pulling embedding model qwen3-embedding:0.6b..."
        ollama pull qwen3-embedding:0.6b
        echo "[ollama-init] Embedding model ready!"
    networks:
      - ds_network

  api:
    env_file:
      - ${ENV_FILE:-.env}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        PNPM_VERSION: "${PNPM_VERSION:-9.0.0}"
    image: datasourceintelligence-api:local
    container_name: ds_api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DB_PUSH_ON_START: "${DB_PUSH_ON_START:-true}"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/datasource
      REDIS_URL: redis://redis:6379
      GTE_API_BASE: "${GTE_API_BASE:-http://ollama:11434/v1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      autoheal: "true"
    networks:
      - ds_network

  worker:
    env_file:
      - ${ENV_FILE:-.env}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        PNPM_VERSION: "${PNPM_VERSION:-9.0.0}"
    image: datasourceintelligence-worker:local
    container_name: ds_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PUSH_ON_START: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/datasource
      REDIS_URL: redis://redis:6379
      GTE_API_BASE: "${GTE_API_BASE:-http://ollama:11434/v1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - ds_network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        PNPM_VERSION: "${PNPM_VERSION:-9.0.0}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    image: datasourceintelligence-web:local
    container_name: ds_web
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      COZE_PROJECT_ENV: PROD
      HOSTNAME: 0.0.0.0
      PORT: 5000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      autoheal: "true"
    networks:
      - ds_network

  nginx:
    image: nginx:1.27-alpine
    container_name: ds_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/api/health >/dev/null && wget -qO- http://127.0.0.1/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      autoheal: "true"
    networks:
      - ds_network

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: ds_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "${AUTOHEAL_INTERVAL:-10}"
      AUTOHEAL_START_PERIOD: "${AUTOHEAL_START_PERIOD:-60}"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "${AUTOHEAL_DEFAULT_STOP_TIMEOUT:-10}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ds_network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  ds_network:
    driver: bridge
