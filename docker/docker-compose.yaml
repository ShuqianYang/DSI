name: datasourceintelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: ds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datasource
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ds_network

  redis:
    image: redis:7-alpine
    container_name: ds_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ds_network

  api:
    env_file:
      - .env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        PNPM_VERSION: "${PNPM_VERSION:-9.0.0}"
    image: datasourceintelligence-api:local
    container_name: ds_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DB_PUSH_ON_START: "${DB_PUSH_ON_START:-true}"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/datasource
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ds_network

  worker:
    env_file:
      - .env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        PNPM_VERSION: "${PNPM_VERSION:-9.0.0}"
    image: datasourceintelligence-worker:local
    container_name: ds_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PUSH_ON_START: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/datasource
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ds_network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        PNPM_VERSION: "${PNPM_VERSION:-9.0.0}"
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001}"
    image: datasourceintelligence-web:local
    container_name: ds_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      COZE_PROJECT_ENV: PROD
      HOSTNAME: 0.0.0.0
      PORT: 5000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ds_network

volumes:
  postgres_data:
  redis_data:

networks:
  ds_network:
    driver: bridge
